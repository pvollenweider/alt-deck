apiVersion: apps/v1
kind: Deployment
metadata:
  name: alt-deck
  namespace: alt-deck
  labels:
    app: alt-deck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alt-deck
  template:
    metadata:
      labels:
        app: alt-deck
    spec:
      containers:
        - name: alt-deck
          image: ghcr.io/pvollenweider/alt-deck:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
